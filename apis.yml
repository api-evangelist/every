name: Every
description: 'Every is an AI-native, all-in-one back-office and finance platform built for startups,
  unifying incorporation, business banking and cards, treasury and cash management, global payroll,
  HR and benefits, AI-assisted bookkeeping, and startup tax preparation (including R&D tax credits)
  into a single system. It offers free Delaware C-corp formation, business checking with cashback
  debit cards, treasury-bill and money-market investing, and bundled per-stage plans for new founders
  through established startups. Backed by Redpoint Ventures. Every does not currently publish a public
  developer API, SDKs, or developer documentation; this profile captures its identity, commercial, and
  domain-security surface.'
